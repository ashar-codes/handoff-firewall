# Render Blueprint: one free web service running the UI, API and durable worker.
# Secrets use sync: false, so Render asks for them in the dashboard; none are stored here.
services:
  - type: web
    name: handoff-firewall
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: deployment/hackathon
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN  # optional: defaults to Render's https service URL
        sync: false
      - key: DATABASE_URL  # Supabase Session pooler URI (port 5432), with ?sslmode=require
        sync: false
      - key: MIGRATION_DATABASE_URL  # optional; defaults to DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: handoff-evidence
      - key: MODEL_PROVIDER
        value: groq
      - key: MODEL_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD  # first deploy only; delete after the admin exists
        sync: false
