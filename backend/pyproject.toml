[project]
name = "handoff-firewall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.142,<0.143", "uvicorn[standard]>=0.54,<0.55", "sqlalchemy>=2.1,<2.2", "alembic>=1.20,<1.21", "psycopg[binary]>=3.3,<3.4", "pydantic-settings>=2.15,<2.16", "argon2-cffi>=25.1,<26", "python-multipart>=0.0.32,<0.1", "httpx>=0.28,<0.29", "pypdf>=6.19,<7"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8", "ruff>=0.16,<0.17"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependencies use function-call defaults by design.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
